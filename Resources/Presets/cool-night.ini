Techniques=prod80_04_ColorTemperature@PD80_04_Color_Temperature.fx,prod80_04_ColorBalance@PD80_04_Color_Balance.fx,Curves@Curves.fx,Vignette@Vignette.fx
TechniqueSorting=prod80_04_ColorTemperature@PD80_04_Color_Temperature.fx,prod80_04_ColorBalance@PD80_04_Color_Balance.fx,Curves@Curves.fx,Vignette@Vignette.fx

[Curves.fx]
Contrast=0.120000
Formula=4
Mode=0

[PD80_04_Color_Balance.fx]
h_RedShift=0.030000
preserve_luma=1
s_BlueShift=0.080000
s_RedShift=-0.020000
separation_mode=1

[PD80_04_Color_Temperature.fx]
Kelvin=8000
LumPreservation=1.000000
kMix=0.350000

[Vignette.fx]
Amount=-0.400000
Center=0.500000,0.500000
Radius=1.500000
Ratio=1.000000
Slope=2
Type=0
